services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: terra_local_only
      POSTGRES_DB: terra
    ports:
      - "5433:5432"
    volumes:
      - terra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra"]
      interval: 3s
      retries: 20

volumes:
  terra_pgdata:
